<script>
document.addEventListener('DOMContentLoaded', () => {
  /* ===============================
     1) Fade-in-on-scroll animations
     =============================== */
  const animTargets = document.querySelectorAll('.about, .store-badge-section, .feature .text');
  if (animTargets.length) {
    const animObserver = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    animTargets.forEach(el => animObserver.observe(el));
  }

  /* ===============================
     2) Desktop top-nav fade on scroll
     =============================== */
  const nav = document.querySelector('.top-nav');
  if (nav) {
    const links   = nav.querySelectorAll('li a');
    const maxFade = 200;
    const minShade = 51;
    window.addEventListener('scroll', () => {
      const y   = window.scrollY;
      const pct = Math.min(y / maxFade, 1);
      nav.style.background     = `rgba(255,255,255,${pct})`;
      nav.style.backdropFilter = `blur(${pct * 5}px)`;
      const shade = Math.round(255 - pct * (255 - minShade));
      const color = `rgb(${shade},${shade},${shade})`;
      links.forEach(a => a.style.color = color);
      nav.classList.toggle('scrolled', pct > 0);
    }, { passive: true });
  }

  /* ===============================
     3) Mobile nav (match Home)
     =============================== */
  const mobileNav  = document.querySelector('.mobile-nav');
  const mobileMenu = document.getElementById('mobileMenu');
  const toggleBtn  = document.getElementById('mobileToggle');
  const titleBtn   = document.getElementById('mobilePageTitle');
  const headerEl   = document.querySelector('.black-header'); // hero area
  if (mobileNav && mobileMenu && toggleBtn && titleBtn && headerEl) {
    // Page title mapping (force Services on this route)
    const path = window.location.pathname;
    const titleMap = {
      '/': 'Home',
      '/services/': 'Services',
      '/rewards/': 'Rewards',
      '/about/': 'About Us'
    };
    titleBtn.textContent = titleMap[path] || 'Services';

    // A11y expand/collapse
    const setExpanded = (open) => {
      mobileNav.classList.toggle('expanded', open);
      toggleBtn.classList.toggle('open', open);
      toggleBtn.setAttribute('aria-expanded', String(open));
      titleBtn.setAttribute('aria-expanded', String(open));
    };
    setExpanded(false);

    const toggleMenu = (e) => {
      e?.stopPropagation();
      setExpanded(!mobileNav.classList.contains('expanded'));
    };

    // Open/close bindings (title acts as toggle)
    toggleBtn.addEventListener('click', toggleMenu);
    titleBtn.addEventListener('click', toggleMenu);
    titleBtn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleMenu(e); }
    });

    // Click outside to close
    document.addEventListener('click', (e) => {
      if (!mobileNav.contains(e.target)) setExpanded(false);
    });

    // Close on menu link click
    mobileMenu.querySelectorAll('a').forEach(a => {
      a.addEventListener('click', () => setExpanded(false));
    });

    // Compact-on-scroll + chevron shift to hug right edge until compact
    const isMobile = () => window.matchMedia('(max-width: 768px)').matches;
    const COMPACT_AT = 0.5; // 50% of header height
    let headerThreshold = headerEl.offsetHeight || window.innerHeight;

    const recalcHeaderThreshold = () => {
      headerThreshold = headerEl.offsetHeight || window.innerHeight;
    };

    function computeToggleShift() {
      if (!isMobile()) { mobileNav.style.setProperty('--toggle-shift', '0px'); return; }
      const wasCompact = mobileNav.classList.contains('compact');
      if (wasCompact) mobileNav.classList.remove('compact');

      const navRect    = mobileNav.getBoundingClientRect();
      const titleRect  = titleBtn.getBoundingClientRect();
      const toggleRect = toggleBtn.getBoundingClientRect();

      const RIGHT_PADDING = 20;
      const rightInnerEdge = navRect.right - RIGHT_PADDING;
      const targetLeftPreCompact = rightInnerEdge - toggleRect.width;
      const compactLeft = titleRect.right + 6;
      const delta = Math.max(0, Math.round(targetLeftPreCompact - compactLeft));
      mobileNav.style.setProperty('--toggle-shift', `${delta}px`);

      if (wasCompact) mobileNav.classList.add('compact');
    }

    function applyCompact() {
      if (!isMobile()) {
        mobileNav.classList.remove('compact');
        mobileNav.style.setProperty('--toggle-shift', '0px');
        return;
      }
      const compactThreshold = headerThreshold * COMPACT_AT;
      const scrolledPast = window.scrollY >= compactThreshold;
      mobileNav.classList.toggle('compact', scrolledPast);
      if (mobileNav.classList.contains('compact')) {
        mobileNav.style.setProperty('--toggle-shift', '0px');
      } else {
        computeToggleShift();
      }
    }

    const reflow = () => { recalcHeaderThreshold(); computeToggleShift(); applyCompact(); };
    ['load','resize','orientationchange'].forEach(evt =>
      window.addEventListener(evt, () => setTimeout(reflow, 50))
    );
    window.addEventListener('scroll', applyCompact, { passive: true });

    // Initial layout
    reflow();
  }
});
</script>
