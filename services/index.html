 <script>
  document.addEventListener('DOMContentLoaded', () => {
    const hamburger = document.getElementById('hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    const blurOverlay = document.getElementById('mobileBlurOverlay');

    function closeMobileMenu() {
      hamburger.classList.remove('active');
      mobileMenu.classList.remove('show');
      if (blurOverlay) blurOverlay.classList.remove('show');
    }

    if (hamburger && mobileMenu) {
      hamburger.addEventListener('click', () => {
        const isActive = hamburger.classList.toggle('active');
        mobileMenu.classList.toggle('show');
        if (blurOverlay) blurOverlay.classList.toggle('show');
      });

      mobileMenu.querySelectorAll('a').forEach(link => {
        link.addEventListener('click', closeMobileMenu);
      });

      if (blurOverlay) {
        blurOverlay.addEventListener('click', closeMobileMenu);
      }
    }
  });
</script>
